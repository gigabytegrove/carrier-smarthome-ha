name: Publish validated Carrier release
on:
  workflow_run:
    workflows: [Validate]
    types: [completed]
permissions:
  contents: write
jobs:
  release:
    if: >
      github.event.workflow_run.conclusion == 'success' &&
      github.event.workflow_run.event == 'push' &&
      github.event.workflow_run.head_repository.full_name == github.repository &&
      github.event.workflow_run.head_branch == 'main'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ github.event.workflow_run.head_sha }}
          fetch-depth: 0
          persist-credentials: false
      - name: Publish current validated commit
        env:
          GH_TOKEN: ${{ github.token }}
          SHA: ${{ github.event.workflow_run.head_sha }}
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin main
          [[ "$(git rev-parse origin/main)" == "$SHA" ]] || { echo "Superseded validation"; exit 0; }
          VERSION="$(python3 - <<'PY'
          import json
          from pathlib import Path
          print(json.loads(Path("custom_components/carrier_smarthome/manifest.json").read_text())["version"])
          PY
          )"
          [[ "$VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]] || exit 1
          TAG="v$VERSION"
          if gh release view "$TAG" >/dev/null 2>&1; then echo "Release exists"; exit 0; fi
          if git ls-remote --exit-code --tags origin "refs/tags/$TAG" >/dev/null 2>&1; then echo "Tag already exists; refusing reuse"; exit 1; fi
          gh release create "$TAG" --target "$SHA" --title "Carrier SmartHome $TAG" --notes "Security: Carrier cloud requests are restricted to approved HTTPS endpoints and authentication contexts. Tested by repository CI against Home Assistant 2026.11.1 imports. Existing devices, entities, and climate controls are unchanged; real hardware validation remains outstanding."
