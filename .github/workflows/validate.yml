name: Validate

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  static:
    name: Python and JSON
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: Test credential destination controls
        run: python -m unittest discover -s tests -p test_security_endpoint.py
      - name: Compile integration Python
        run: python -m compileall -q custom_components/carrier_smarthome
      - name: Run offline thermostat control regression tests
        run: |
          python -m unittest discover -s tests -p 'test_optimistic_feedback.py' -v
          python -m unittest discover -s tests -p 'test_cloud_state_trace.py' -v
          python -m unittest discover -s tests -p 'test_alpha10_contract.py' -v
      - name: Validate integration JSON
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          for path in Path("custom_components/carrier_smarthome").rglob("*.json"):
              with path.open("r", encoding="utf-8") as handle:
                  json.load(handle)
              print(f"OK {path}")
          json.loads(Path("hacs.json").read_text(encoding="utf-8"))
          PY

  hassfest:
    name: Home Assistant Hassfest
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: home-assistant/actions/hassfest@master

  hacs:
    name: HACS validation
    runs-on: ubuntu-latest
    steps:
      - uses: hacs/action@main
        with:
          category: integration

  homeassistant-2026-11:
    name: Home Assistant 2026.11.1 import
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.14'
      - run: python -m pip install 'homeassistant==2026.11.1'
      - run: python -c 'import custom_components.carrier_smarthome; import custom_components.carrier_smarthome.config_flow; import custom_components.carrier_smarthome.api; print("HA 2026.11.1 imports passed")'
