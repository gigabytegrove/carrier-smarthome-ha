query getEntryLevelNotificationPrefs($serial: String!) {
  entryLevelNotificationPrefs(serial: $serial) {
    push {
      mute
      reminders {
        utilizedHvacFilter {
          enabled
          config {
            intervalInMonths
            lastExecutionDate
            nextExecutionDate
          }
        }
        utilizedVentilatorFilter {
          enabled
          config {
            intervalInMonths
            lastExecutionDate
            nextExecutionDate
          }
        }
        utilizedHumidifierFilter {
          enabled
          config {
            intervalInMonths
            lastExecutionDate
            nextExecutionDate
          }
        }
      }
      alerts {
        offline {
          enabled
        }
      }
    }
  }
}
