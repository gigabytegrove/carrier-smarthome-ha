query runtimeUsageInfinity($input: GetRuntimeUsageInput!) {
  runtimeUsageInfinity(input: $input) {
    success
    message
    tempUnitFormat: tempUnitFormat
    runtimeBuckets {
      timeBucket
      totalRuntime
      outsideTemperature
      isSystemOn
      zoneSettings {
        zoneNumber
        coolingSetpoint
        heatingSetpoint
        humidity
        highestRoomTemperature
        lowestRoomTemperature
      }
      totalCoolRuntime
      totalHeatRuntime
    }
  }
}
