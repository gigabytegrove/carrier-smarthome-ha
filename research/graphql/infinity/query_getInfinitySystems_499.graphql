query getInfinitySystems($userName: String!) {
  infinitySystems(userName: $userName) {
    profile {
      serial
      name
      firmware
      model
      idutype
    }
    status {
      localTime
      localTimeOffset
      utcTime
      wcTime
      isDisconnected
      cfgem
      mode
      vacatrunning
      oat
      odu {
        type
        opstat
        opmode
      }
      filtrlvl
      idu {
        type
        opstat
        cfm
      }
      vent
      ventlvl
      humid
      humlvl
      uvlvl
      zones {
        id
        rt
        rh
        fan
        htsp
        clsp
        hold
        enabled
        currentActivity
        present
      }
      zoneboards {
        id
        present
      }
    }
    config {
      etag
      mode
      cfgem
      cfgdead
      cfghumid
      erate
      grate
      heatsource
      vacat
      vacstart
      vacend
      vacmint
      vacmaxt
      vacfan
      cfgzoning
      fueltype
      gasunit
      cfgvent
      cfghumid
      cfguv
      cfgfan
      vacat
      filtertype
      filterinterval
      humidityVacation {
        rclgovercool
        ventspdclg
        ventclg
        rhtg
        humidifier
        humid
        venthtg
        rclg
        ventspdhtg
      }
      zones {
        id
        name
        enabled
        hold
        holdActivity
        otmr
        program {
          id
          day {
            id
            zoneId
            period {
              id
              zoneId
              dayId
              activity
              time
              enabled
            }
          }
        }
        activities {
          id
          zoneId
          type
          fan
          previousFan
          htsp
          clsp
        }
      }
      wholeHouse {
        hold
        holdActivity
        otmr
        activities {
          id
          htsp
          clsp
          fan
        }
      }
      humidityAway {
        humid
        humidifier
        rhtg
        rclg
        rclgovercool
      }
      humidityHome {
        humid
        humidifier
        rhtg
        rclg
        rclgovercool
      }
    }
    diagnosticInfo {
      support
      equipment {
        idu
        odu
        hum
        ven
        zone
      }
      activeDiagnostic {
        id
        status
        command
      }
    }
  }
}
