mutation UpsertSelfReportedService($input: UpsertSelfReportedServiceInput!) {
  upsertSelfReportedService(input: $input) {
    success
    message
    data {
      id
      date
      servicesPerformed
      inspectionPerformed
      notes
      totalCost
      customerId
      homeId
      serialNo
      modelNo
    }
  }
}
